<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPFOY Dashboard</title>
    <link rel="icon" type="image/png" href="img/upfoy-logo.png">

    <!-- Bootstrap CSS (Bootswatch Lux) -->
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/shell.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <div id="appShell"></div>
    <script>
        window.FOY_PAGE = {
            active: 'presbyteries',
            quickAdd: [
                { label: 'Register Presbytery', target: '#registerPresbyteryModal' },
                { label: 'Register User', target: '#registerUserModal' }
            ]
        };
    </script>
    <script src="assets/js/shell.js"></script>

    <div class="main content">
        <div class="mt-4 ms-3 me-3">
            <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-2">
                <h3 class="mb-0">Presbyteries</h3>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#registerPresbyteryModal">
                    <i class="bi bi-plus-circle me-1"></i>Register Presbytery
                </button>
            </div>
            <div class="text-muted small mb-3" id="presbyteryStats"></div>

            <div class="d-flex gap-2 mb-3 align-items-center flex-wrap">
                <div class="page-search" style="max-width: 280px;">
                    <i class="bi bi-search"></i>
                    <input type="text" id="presbyterySearch" class="form-control" placeholder="Search presbyteries...">
                </div>
                <select id="presbyterySort" data-dd-enhance class="form-select">
                    <option value="name">Sort by Name</option>
                    <option value="congregations">Sort by Congregations</option>
                </select>
            </div>

            <div id="presbyteryEmpty" class="text-center py-5 d-none">
                <i class="bi bi-building-slash display-4 text-muted"></i>
                <p class="text-muted mt-2 mb-1">No presbyteries found.</p>
                <a href="#" data-bs-toggle="modal" data-bs-target="#registerPresbyteryModal">Register the first one</a>
            </div>

            <div class="row" id="presbyteryList">
                <!-- Cards will load here dynamically -->
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerUserModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Register User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerUserForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Name</label>
                            <input type="text" id="userName" class="form-control" placeholder="Name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Email Address</label>
                            <input type="email" id="userEmail" class="form-control" placeholder="Email Address"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Password</label>
                            <input type="password" id="userPassword" class="form-control" placeholder="Password"
                                required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Role</label>
                            <select id="userRole" class="form-select" required>
                                <option value="">--Select Role--</option>
                                <option value="User">User</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Structure Access</label>
              <div id="userStructures" class="border rounded p-2"></div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Congregation Access</label>
              <select id="userCongregation" class="form-select">
                <option value="ALL">ALL</option>
              </select>
            </div>                    </form>
                </div>
                <div class="modal-footer">
                    <p class="error-message" id="register-error"></p>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveUserBtn" onclick="registerUserENC()">Save New
                        User</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerPresbyteryModal" tabindex="-1" data-bs-backdrop="static"
        data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Register Presbytery</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerPresbyteryForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Presbytery Name</label>
                            <input type="text" id="presbyteryName" class="form-control" placeholder="Presbytery Name"
                                required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Synod</label>
                            <input type="text" id="presbyterySynod" class="form-control"
                                placeholder="Synod (If Applicable)" />
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <p class="error-message" id="presbytery-error"></p>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="registerPresbytery()">Register
                        Presbytery</button>
                </div>
            </div>
        </div>
    </div>



    <!-- Edit Presbytery Modal -->
    <div class="modal fade" id="editPresbyteryModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-pencil me-1"></i>Edit Presbytery</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editPresbyteryID" />
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Presbytery Name</label>
                        <input type="text" id="editPresbyteryName" class="form-control" placeholder="Presbytery Name" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Synod</label>
                        <input type="text" id="editPresbyterySynod" class="form-control" placeholder="Synod (If Applicable)" />
                    </div>
                </div>
                <div class="modal-footer">
                    <p class="error-message" id="edit-presbytery-error"></p>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveEditPresbytery()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deletePresbyteryModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-1"></i>Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1">Delete <strong id="deletePresbyteryName"></strong>?</p>
                    <p id="deletePresbyteryWarning" class="text-danger small mb-0 d-none"></p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger btn-sm" id="confirmDeletePresbyteryBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
        <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive">
            <div class="d-flex">
                <div class="toast-body" id="appToastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Shared / Base Scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/db.js"></script>
  <script src="assets/js/sheet.js"></script>
  <script src="assets/js/audit.js"></script>

    <!-- Authentication -->
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/file.js"></script>

    <!-- Dashboard features -->
    <script src="assets/js/db-merge.js"></script>
    <script src="assets/js/congregation.js"></script>
    <script src="assets/js/presbytery.js"></script>

    <!-- Final initializer -->
    <script src="assets/js/app.js"></script>
    <!-- Bootstrap Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
