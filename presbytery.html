<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPFOY Dashboard</title>
    <link rel="icon" type="image/png" href="img/upfoy-logo.png">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">


    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light">
    <header class="header justify-content-sm-between text-white p-2 rounded" style="background-color: #1e3a8a">
        <a class=" h2 navbar-brand" href="dashboard.html">FOY Membership</a>
        <div class="ms-auto d-flex align-items-center gap-2">
            <span id="userWelcome" class="text-white fw-bold"></span>
            <span class="divider"></span>
            <button class="btn btn-sm text-white buttonRegister" data-bs-toggle="modal"
                data-bs-target="#registerPresbyteryModal">Register Presbytery</button>
            <button class="btn btn-sm text-white buttonRegister" data-bs-toggle="modal"
                data-bs-target="#registerUserModal">Register User</button>
            <button class="btn btn-sm text-white buttonRegister" onclick="exportDatabase()">Export Data</button>
                  <button class="btn btn-sm btn-outline-light" id="syncSheetBtn" onclick="manualSyncFromSheet()" title="Sync latest data from Google Sheet">&#x21BB; Sync</button>
      <button class="btn btn-sm text-white buttonLogout" onclick="logout()">Logout</button>
        </div>
    </header>

    <nav class="nav flex-column p-2 gap-2">
        <!-- <ul class="nav flex-column p-2 gap-2"> -->
        <li class="nav-item">
            <a class="nav-link text-white" href="dashboard.html">Home</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="#">Presbyteries</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="congregations.html">Congregations</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="members.html">Members</a>
        </li>
        <li class="nav-item">
            <a class="nav-link text-white" href="#">Reports</a>
        </li>
        <!-- </ul> -->
    </nav>

    <div class="main">
        <div class="mt-4 ms-3 me-3">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h3 class="mb-0">Presbyteries</h3>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#registerPresbyteryModal">
                    <i class="bi bi-plus-circle me-1"></i>Register Presbytery
                </button>
            </div>

            <div class="d-flex gap-2 mb-3 align-items-center flex-wrap">
                <div class="input-group" style="max-width: 280px;">
                    <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="presbyterySearch" class="form-control" placeholder="Search presbyteries...">
                </div>
                <select id="presbyterySort" class="form-select" style="max-width: 180px; width: auto;">
                    <option value="name">Sort by Name</option>
                    <option value="congregations">Sort by Congregations</option>
                </select>
                <span class="ms-auto text-muted small" id="presbyteryStats"></span>
            </div>

            <div id="presbyteryEmpty" class="text-center py-5 d-none">
                <i class="bi bi-building-slash display-4 text-muted"></i>
                <p class="text-muted mt-2 mb-1">No presbyteries found.</p>
                <a href="#" data-bs-toggle="modal" data-bs-target="#registerPresbyteryModal">Register the first one</a>
            </div>

            <div class="row" id="presbyteryList">
                <!-- Cards will load here dynamically -->
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerUserModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Register User</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerUserForm">
                        <div class="mb-3">
                            <input type="text" id="userName" class="form-control" placeholder="Name" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" id="userEmail" class="form-control" placeholder="Email Address"
                                required>
                        </div>
                        <div class="mb-3">
                            <input type="password" id="userPassword" class="form-control" placeholder="Password"
                                required>
                        </div>
                        <div class="mb-3">
                            <select id="userRole" class="form-select mb-3" required>
                                <option value="">--Select Role--</option>
                                <option value="User">User</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Presbytery Access</label>
              <select id="userPresbytery" class="form-select">
                <option value="ALL">ALL</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Congregation Access</label>
              <select id="userCongregation" class="form-select">
                <option value="ALL">ALL</option>
              </select>
            </div>                    </form>
                </div>
                <div class="modal-footer">
                    <p class="error-message" id="register-error"></p>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveUserBtn" onclick="registerUserENC()">Save New
                        User</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="registerPresbyteryModal" tabindex="-1" data-bs-backdrop="static"
        data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Register Presbytery</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="registerPresbyteryForm">
                        <div class="mb-3">
                            <input type="text" id="presbyteryName" class="form-control" placeholder="Presbytery Name"
                                required />
                        </div>
                        <div class="mb-3">
                            <input type="text" id="presbyterySynod" class="form-control"
                                placeholder="Synod (If Applicable)" />
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <p class="error-message" id="presbytery-error"></p>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="registerPresbytery()">Register
                        Presbytery</button>
                </div>
            </div>
        </div>
    </div>



    <!-- Edit Presbytery Modal -->
    <div class="modal fade" id="editPresbyteryModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title"><i class="bi bi-pencil me-1"></i>Edit Presbytery</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editPresbyteryID" />
                    <div class="mb-3">
                        <input type="text" id="editPresbyteryName" class="form-control" placeholder="Presbytery Name" required />
                    </div>
                    <div class="mb-3">
                        <input type="text" id="editPresbyterySynod" class="form-control" placeholder="Synod (If Applicable)" />
                    </div>
                </div>
                <div class="modal-footer">
                    <p class="error-message" id="edit-presbytery-error"></p>
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveEditPresbytery()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deletePresbyteryModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle me-1"></i>Confirm Delete</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="mb-1">Delete <strong id="deletePresbyteryName"></strong>?</p>
                    <p id="deletePresbyteryWarning" class="text-danger small mb-0 d-none"></p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger btn-sm" id="confirmDeletePresbyteryBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 9999;">
        <div id="appToast" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive">
            <div class="d-flex">
                <div class="toast-body" id="appToastBody"></div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Shared / Base Scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/db.js"></script>
  <script src="assets/js/sheet.js"></script>
  <script src="assets/js/audit.js"></script>
    <script src="assets/js/ui.js"></script>

    <!-- Authentication -->
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/file.js"></script>

    <!-- Dashboard features -->
    <script src="assets/js/db-merge.js"></script>
    <script src="assets/js/congregation.js"></script>
    <script src="assets/js/presbytery.js"></script>

    <!-- Final initializer -->
    <script src="assets/js/app.js"></script>
    <!-- Bootstrap Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
