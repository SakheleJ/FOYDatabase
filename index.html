<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Login</title>
  <link rel="icon" type="image/png" href="img/upfoy-logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <script>
    // Match whichever theme the user last picked inside the app, so login
    // doesn't flash a different look than the rest of the site.
    try {
      if (localStorage.getItem("foyTheme") === "dark") {
        document.documentElement.setAttribute("data-bs-theme", "dark");
      }
    } catch (e) {}
  </script>
  <style>
    .login-wrapper { max-width: 480px; margin: 80px auto; }
    .login-logo-mark {
      width: 64px; height: 64px; margin: 0 auto; border-radius: var(--bs-border-radius);
      background: var(--shell-accent); display: flex; align-items: center; justify-content: center;
    }
    .login-logo-mark img { width: 68%; height: 68%; object-fit: contain; }
  </style>
</head>
<body>
  <div class="login-wrapper px-3">

    <!-- Logo / heading -->
    <div class="text-center mb-4">
      <div class="login-logo-mark">
        <img src="img/upfoy-logo.png" alt="FOY Logo" onerror="this.parentElement.style.display='none'">
      </div>
      <h4 class="mt-2 fw-bold">FOY Database</h4>
    </div>

    <!-- Login form -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h6 class="card-title mb-3">Login</h6>
        <p class="text-danger small mb-2" id="register-error"></p>
        <div class="mb-2">
          <input class="form-control" type="email" id="login-email" placeholder="Email address" required />
        </div>
        <div class="mb-3">
          <input class="form-control" type="password" id="login-password" placeholder="Password" required />
        </div>
        <button class="btn btn-primary w-100" type="button" onclick="attemptLogin()">
          <span id="login-btn-text">Login</span>
          <span id="login-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>
      </div>
    </div>

  </div>

  <!-- Structure picker — only shown when a user has access to more than one
       data sheet. Hidden/unused today since there's a single structure. -->
  <div class="modal fade" id="structurePickerModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h6 class="modal-title">Choose which data to open</h6>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-3">Your account has access to more than one structure. Pick one to continue.</p>
          <div id="structure-picker-list" class="list-group"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/sheet.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/file.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
