<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Login</title>
  <link rel="icon" type="image/png" href="img/upfoy-logo.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .login-wrapper { max-width: 480px; margin: 80px auto; }
    .sheet-status { font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="login-wrapper px-3">

    <!-- Logo / heading -->
    <div class="text-center mb-4">
      <img src="img/upfoy-logo.png" alt="FOY Logo" height="64" onerror="this.style.display='none'">
      <h4 class="mt-2 fw-bold">FOY Database</h4>
    </div>

    <!-- Google Sheet connection -->
    <div class="card mb-3 shadow-sm">
      <div class="card-body">
        <h6 class="card-title mb-3">Connect to Google Sheet</h6>
        <div class="mb-2">
          <input
            id="sheet-url-input"
            class="form-control form-control-sm"
            type="url"
            placeholder="Paste your Apps Script Web App URL here"
          />
        </div>
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-sm btn-outline-secondary" type="button" onclick="saveSheetURLFromInput()">Save URL</button>
          <span id="sheet-status" class="sheet-status text-muted">No sheet connected.</span>
        </div>
      </div>
    </div>

    <!-- Login form -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h6 class="card-title mb-3">Login</h6>
        <p class="text-danger small mb-2" id="register-error"></p>
        <div class="mb-2">
          <input class="form-control" type="email" id="login-email" placeholder="Email address" required />
        </div>
        <div class="mb-3">
          <input class="form-control" type="password" id="login-password" placeholder="Password" required />
        </div>
        <button class="btn btn-primary w-100" type="button" onclick="loginENC()">
          <span id="login-btn-text">Login</span>
          <span id="login-spinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status"></span>
        </button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/sheet.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/file.js"></script>
  <script src="assets/js/app.js"></script>

  <script>
    // Show saved URL on load
    document.addEventListener("DOMContentLoaded", function () {
      var saved = getSheetURL();
      if (saved) {
        document.getElementById("sheet-url-input").value = saved;
        document.getElementById("sheet-status").textContent = "Sheet URL saved.";
        document.getElementById("sheet-status").className = "sheet-status text-success";
      }
    });

    function saveSheetURLFromInput() {
      var url = document.getElementById("sheet-url-input").value.trim();
      if (!url) {
        document.getElementById("sheet-status").textContent = "Please enter a URL first.";
        document.getElementById("sheet-status").className = "sheet-status text-danger";
        return;
      }
      saveSheetURL(url);
      document.getElementById("sheet-status").textContent = "Sheet URL saved.";
      document.getElementById("sheet-status").className = "sheet-status text-success";
    }
  </script>
</body>
</html>
