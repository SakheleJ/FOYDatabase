<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPFOY Dashboard</title>
  <link rel="icon" type="image/png" href="img/upfoy-logo.png">

  <!-- Bootstrap CSS (Bootswatch Lux) -->
  <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/lux/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/shell.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
  <div id="appShell"></div>
  <script>
    window.FOY_PAGE = {
      active: 'overview',
      quickAdd: [
        { label: 'Register Presbytery', target: '#registerPresbyteryModal' },
        { label: 'Register User', target: '#registerUserModal' }
      ]
    };
  </script>
  <script src="assets/js/shell.js"></script>

  <div class="main content">

    <!-- Summary Stats -->
    <div class="p-3" id="dashboardStats">
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="fw-semibold">Affiliation Period:</span>
        <select id="statPeriodFilter" class="form-select form-select-sm" style="width:auto;min-width:100px;"></select>
      </div>
      <div class="row g-3 mb-2">
        <div class="col-6 col-md-4 col-xl">
          <div class="card stat-card h-100">
            <div class="stat-value text-primary" id="statPresbyteries">—</div>
            <div class="stat-label">Presbyteries</div>
          </div>
        </div>
        <div class="col-6 col-md-4 col-xl">
          <div class="card stat-card h-100">
            <div class="stat-value text-primary" id="statCongregations">—</div>
            <div class="stat-label">Congregations</div>
          </div>
        </div>
        <div class="col-6 col-md-4 col-xl">
          <div class="card stat-card h-100">
            <div class="stat-value text-success" id="statMembers">—</div>
            <div class="stat-label">Members</div>
          </div>
        </div>
        <div class="col-6 col-md-6 col-xl">
          <div class="card stat-card h-100">
            <div class="stat-value text-info" id="statMembershipAge">—</div>
            <div class="stat-label">Membership Average Age</div>
          </div>
        </div>
        <div class="col-12 col-md-6 col-xl">
          <div class="card stat-card h-100">
            <div class="stat-value text-warning" id="statRetention">—</div>
            <div class="stat-label">Retention Rate</div>
            <div class="text-muted" style="font-size:0.72rem;" id="statRetentionNote"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Presbytery Breakdown Table -->
    <div class="px-3 pb-3" id="presbyteryBreakdown">
      <div class="panel">
        <div class="panel-head">
          <h6>Presbytery Breakdown — All Periods</h6>
        </div>
        <div class="panel-body-scroll">
          <table class="table table-sm table-hover align-middle mb-0 data-table" id="presbyteryBreakdownTable">
            <thead id="presbyteryBreakdownHead"></thead>
            <tbody id="presbyteryBreakdownBody">
              <tr><td class="text-muted text-center py-3">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Retention Line Chart / Table -->
    <div class="px-3 pb-3" id="retentionChartSection">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <h6 class="fw-semibold mb-0">Retention by Presbytery — All Periods</h6>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="retentionViewToggleBtn" onclick="toggleRetentionView()">
          <i class="bi bi-table me-1"></i>View as table
        </button>
      </div>
      <div class="card border-0 shadow-sm p-3" style="border-radius:10px;">
        <div id="retentionChart"></div>
        <div id="retentionTable" style="display:none;"></div>
      </div>
    </div>

    <!-- Membership Average Age Line Chart / Table -->
    <div class="px-3 pb-3" id="membershipAgeSection">
      <div class="d-flex align-items-center justify-content-between mb-2">
        <h6 class="fw-semibold mb-0">Membership Average Age by Presbytery — All Periods</h6>
        <button type="button" class="btn btn-outline-secondary btn-sm" id="ageViewToggleBtn" onclick="toggleAgeView()">
          <i class="bi bi-table me-1"></i>View as table
        </button>
      </div>
      <div class="card border-0 shadow-sm p-3" style="border-radius:10px;">
        <div id="membershipAgeChart"></div>
        <div id="membershipAgeTable" style="display:none;"></div>
      </div>
    </div>


  <div class="modal fade" id="registerUserModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Register User</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="registerUserForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Name</label>
              <input type="text" id="userName" class="form-control" placeholder="Name" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Email Address</label>
              <input type="email" id="userEmail" class="form-control" placeholder="Email Address" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Password</label>
              <input type="password" id="userPassword" class="form-control" placeholder="Password" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Role</label>
              <select id="userRole" class="form-select" required>
                <option value="">--Select Role--</option>
                <option value="User">User</option>
                <option value="Admin">Admin</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Structure Access</label>
              <div id="userStructures" class="border rounded p-2"></div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Congregation Access</label>
              <select id="userCongregation" class="form-select">
                <option value="ALL">ALL</option>
              </select>
            </div>          </form>
        </div>
        <div class="modal-footer">
          <p class="error-message" id="register-error"></p>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" id="saveUserBtn" onclick="registerUserENC()">Save New
            User</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="registerPresbyteryModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Register Presbytery</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="registerPresbyteryForm">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Presbytery Name</label>
              <input type="text" id="presbyteryName" class="form-control" placeholder="Presbytery Name" required />
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Synod</label>
              <input type="text" id="presbyterySynod" class="form-control" placeholder="Synod (If Applicable)" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <p class="error-message" id="presbytery-error"></p>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="registerPresbytery()">Register Presbytery</button>
        </div>
      </div>
    </div>
  </div>



  <!-- Shared / Base Scripts -->
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/sheet.js"></script>
  <script src="assets/js/audit.js"></script>

  <!-- Authentication -->
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/file.js"></script>

  <!-- Dashboard features -->
  <script src="assets/js/file.js"></script>
  <script src="assets/js/db-merge.js"></script>
  <script src="assets/js/congregation.js"></script>
  <script src="assets/js/presbytery.js"></script>

  <!-- Dashboard stats -->
  <script src="assets/js/dashboard.js"></script>

  <!-- Final initializer -->
  <script src="assets/js/app.js"></script>
  <!-- Bootstrap Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
